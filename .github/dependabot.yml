version: 2

updates:
  - package-ecosystem: npm
    directory: "/urban-community-admin"
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *" # 09:00 on the 1st of every second month
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    ignore:
      # Major updates are planned, tested and applied by hand: CI cannot catch every
      # runtime break (Redis, Aspire, routing), and they often need code changes.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # v9 replaces useReactTable with a new table API; every table component needs migrating.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *" # 09:00 on the 1st of every second month
      timezone: Europe/Istanbul
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

